[project]
name = "ecommerce-customer-service"
version = "0.1.0"
description = "Pure chat and after-sales extraction backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "openai==2.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.54",
    "aiomysql==0.3.2",
    "pymysql[rsa]==1.2.3",
    "pymilvus==3.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
