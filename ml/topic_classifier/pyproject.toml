[project]
name = "ch10-topic-classifier"
version = "0.1.0"
requires-python = "==3.12.13"
dependencies = [
    "torch==2.14.1+cu130",
    "transformers==5.20.2",
    "accelerate==1.15.0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "iterative-stratification==0.1.9",
    "safetensors==0.8.0",
    "huggingface-hub==2.2.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
