# 本地 Milvus 单机部署，基于官方 v3.0.2 的 Standalone 配置。
# 镜像锚点供数据卷初始化和向量服务复用，保持运行用户与镜像版本一致。
x-milvus-image: &milvus-image milvusdb/milvus:v3.0.2

services:
  # 一次性修正数据卷属主，用标记文件避免每次启动都递归修改整个卷。
  milvus-volume-init:
    image: *milvus-image
    user: '0:0'
    network_mode: none
    read_only: true
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - milvus-data:/var/lib/milvus

  # etcd 保存 Milvus 元数据，压缩旧 revision 并通过健康检查确认节点可用。
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO 保存 Milvus 的对象数据，使用独立持久卷，不向宿主开放对象存储端口。
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

  # 单机向量服务连接同一 Compose 网络内的 etcd 与 MinIO。
  standalone:
    image: *milvus-image
    command: ['milvus', 'run', 'standalone']
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    # 19530 提供 SDK 连接，9091 提供健康接口，均只绑定宿主回环地址。
    ports:
      - '127.0.0.1:19530:19530'
      - '127.0.0.1:9091:9091'
    # 等待属主修正完成和存储容器启动，实际服务可用性再由 healthcheck 判断。
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started

# 元数据、对象数据与向量服务工作数据分卷保存。
volumes:
  etcd-data:
  minio-data:
  milvus-data:
